# Deploy static site to VPS (main → Nginx web root)
#
# Required GitHub secrets:
#   SSH_HOST, SSH_USER, SSH_KEY
#   VPS_WEB_DIR   e.g. /var/www/cendekia-boarding-school
# Optional:
#   SSH_PORT      (default 22)
#   SITE_URL      e.g. https://cbsbogor.or.id  (untuk sitemap/canonical)

name: Deploy Website to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website-pesantren-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          SITE_URL: ${{ secrets.SITE_URL != '' && secrets.SITE_URL || 'https://cbsbogor.or.id' }}
        run: npm run build

      - name: Pack dist
        run: |
          tar czf website-dist.tgz -C dist .
          ls -lh website-dist.tgz

      - name: Upload bundle to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          source: website-dist.tgz
          target: /tmp/cendekia-web
          overwrite: true

      - name: Extract to web root & reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            WEB_DIR="${{ secrets.VPS_WEB_DIR }}"
            test -n "$WEB_DIR"
            sudo mkdir -p "$WEB_DIR"
            sudo tar xzf /tmp/cendekia-web/website-dist.tgz -C "$WEB_DIR"
            sudo chown -R www-data:www-data "$WEB_DIR" 2>/dev/null || sudo chown -R nginx:nginx "$WEB_DIR" 2>/dev/null || true
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl reload nginx
            fi
            rm -f /tmp/cendekia-web/website-dist.tgz
            echo "=== WEBSITE DEPLOY OK (${{ github.sha }}) → $WEB_DIR ==="
