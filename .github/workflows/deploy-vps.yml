# Deploy Astro SSR (website + admin CMS) to VPS
#
# Required GitHub secrets:
#   SSH_HOST, SSH_USER, SSH_KEY
#   VPS_WEB_DIR     e.g. /var/www/cendekia-boarding-school
#   SESSION_SECRET  min 16 chars (admin login)
# Optional:
#   SSH_PORT, SITE_URL, VPS_DATA_DIR (default: /var/www/cendekia-data)
#   ADMIN_USERNAME, ADMIN_PASSWORD (only used on first DB seed)

name: Deploy Website to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website-pesantren-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          SITE_URL: ${{ secrets.SITE_URL != '' && secrets.SITE_URL || 'https://cendekiaboardingschool.id' }}
        run: npm run build

      - name: Pack dist
        run: |
          cp deploy/ecosystem.config.cjs dist/
          tar czf website-dist.tgz -C dist .
          ls -lh website-dist.tgz

      - name: Upload bundle to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          source: website-dist.tgz
          target: /tmp/cendekia-web
          overwrite: true

      - name: Extract and restart Node app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          envs: SESSION_SECRET,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -euo pipefail
            WEB_DIR="${{ secrets.VPS_WEB_DIR }}"
            DATA_DIR="${{ secrets.VPS_DATA_DIR != '' && secrets.VPS_DATA_DIR || '/var/www/cendekia-data' }}"
            test -n "$WEB_DIR"
            test -n "${SESSION_SECRET:-}"

            mkdir -p "$WEB_DIR" "$DATA_DIR/uploads"
            # Hapus sisa deploy static lama (index.html dll.) agar /admin/* tidak fallback ke beranda
            find "$WEB_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar xzf /tmp/cendekia-web/website-dist.tgz -C "$WEB_DIR"
            rm -f /tmp/cendekia-web/website-dist.tgz

            export HOST=127.0.0.1
            export PORT=4321
            export DATA_DIR
            export SESSION_SECRET
            export ADMIN_USERNAME="${ADMIN_USERNAME:-admin}"
            export ADMIN_PASSWORD="${ADMIN_PASSWORD:-}"

            if command -v pm2 >/dev/null 2>&1; then
              cd "$WEB_DIR"
              pm2 startOrRestart ecosystem.config.cjs --update-env
              pm2 save || true
            else
              echo "PM2 not installed — install pm2 and run ecosystem.config.cjs"
            fi

            if command -v nginx >/dev/null 2>&1; then
              if sudo -n nginx -t 2>/dev/null; then
                sudo -n systemctl reload nginx
              fi
            fi

            echo "=== DEPLOY OK (${{ github.sha }}) app=$WEB_DIR data=$DATA_DIR ==="
            echo "NOTE: Reverse proxy (Caddy/Nginx) harus arahkan ke 127.0.0.1:4321 — lihat deploy/Caddyfile.example"
            curl -sf -o /dev/null http://127.0.0.1:4321/admin/login && echo "Node /admin/login OK" || echo "WARN: Node tidak merespons di :4321"

        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
