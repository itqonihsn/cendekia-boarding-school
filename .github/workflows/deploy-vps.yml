# Deploy static site to VPS (main → web root)
#
# Required GitHub secrets:
#   SSH_HOST, SSH_USER, SSH_KEY
#   VPS_WEB_DIR   e.g. /var/www/cendekia-boarding-school
# Optional:
#   SSH_PORT      (default 22)
#   SITE_URL      e.g. https://cendekiaboardingschool.id
#
# Catatan: SSH user harus punya tulis ke VPS_WEB_DIR (tanpa sudo password).
# One-time di VPS:
#   sudo mkdir -p /var/www/cendekia-boarding-school
#   sudo chown -R $USER:$USER /var/www/cendekia-boarding-school

name: Deploy Website to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website-pesantren-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          SITE_URL: ${{ secrets.SITE_URL != '' && secrets.SITE_URL || 'https://cendekiaboardingschool.id' }}
        run: npm run build

      - name: Pack dist
        run: |
          tar czf website-dist.tgz -C dist .
          ls -lh website-dist.tgz

      - name: Upload bundle to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          source: website-dist.tgz
          target: /tmp/cendekia-web
          overwrite: true

      - name: Extract to web root
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            WEB_DIR="${{ secrets.VPS_WEB_DIR }}"
            test -n "$WEB_DIR"

            # Tanpa sudo interaktif — folder harus owned oleh user SSH
            mkdir -p "$WEB_DIR"
            tar xzf /tmp/cendekia-web/website-dist.tgz -C "$WEB_DIR"
            rm -f /tmp/cendekia-web/website-dist.tgz

            # Reload Nginx hanya jika passwordless sudo tersedia (opsional)
            if command -v nginx >/dev/null 2>&1; then
              if sudo -n nginx -t 2>/dev/null; then
                sudo -n systemctl reload nginx
                echo "Nginx reloaded"
              else
                echo "Skip Nginx reload (sudo password diperlukan). File sudah ter-deploy."
              fi
            fi

            echo "=== WEBSITE DEPLOY OK (${{ github.sha }}) → $WEB_DIR ==="
            ls -lah "$WEB_DIR" | head -n 20
